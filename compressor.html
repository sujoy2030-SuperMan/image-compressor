<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Compressor - Image Tools Hub</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#cbd5e1;
margin-bottom:25px;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
padding:25px;
border-radius:20px;
}

.upload-box{
height:150px;
border:3px dashed #3b82f6;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
cursor:pointer;
font-size:20px;
font-weight:bold;
margin-bottom:20px;
}

.upload-box:hover{
background:rgba(59,130,246,.08);
}

input[type=file]{
display:none;
}

.slider-area{
margin:20px 0;
}

.slider-area label{
display:block;
margin-bottom:10px;
}

input[type=range]{
width:100%;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:20px;
}

.preview{
background:#111827;
padding:15px;
border-radius:15px;
text-align:center;
min-height:300px;
}

.preview img{
max-width:100%;
max-height:240px;
object-fit:contain;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-top:20px;
}

.stat{
background:#111827;
padding:15px;
border-radius:15px;
text-align:center;
}

.download-btn{
width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:15px;
cursor:pointer;
font-size:18px;
font-weight:bold;
color:white;
background:linear-gradient(90deg,#3b82f6,#8b5cf6);
}

@media(max-width:768px){
.grid{
grid-template-columns:1fr;
}

.stats{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<div class="container">

<h1>🗜 Image Compressor</h1>
<p class="subtitle">Compress JPG, PNG & WebP Images Online</p>

<div class="card">

<label class="upload-box">
<div>
📂 Drag & Drop Image Here
<br><br>
or Click To Upload
</div>
<input type="file" id="imageInput" accept="image/*">
</label>

<div class="slider-area">
<label>Compression Quality: 70%</label>
<input type="range" min="10" max="100" value="70">
</div>

<div class="grid">

<div class="preview">
<h2>Before</h2>
<img id="beforeImage">
</div>

<div class="preview">
<h2>After</h2>
<img id="afterImage">
</div>

</div>

<div class="stats">

<div class="stat">
<h3>Original Size</h3>
<p>0 KB</p>
</div>

<div class="stat">
<h3>Compressed Size</h3>
<p>0 KB</p>
</div>

<div class="stat">
<h3>Saved</h3>
<p>0%</p>
</div>

</div>

<button class="download-btn">
Download Compressed Image
</button>

</div>

</div>

<script>
const imageInput = document.getElementById("imageInput");
const beforeImage = document.getElementById("beforeImage");
const afterImage = document.getElementById("afterImage");

const slider = document.querySelector("input[type=range]");
const qualityLabel = document.querySelector(".slider-area label");

const stats = document.querySelectorAll(".stat p");

let compressedBlob = null;
let currentImage = null;

slider.addEventListener("input", () => {
    qualityLabel.textContent =
        "Compression Quality: " + slider.value + "%";

    if(currentImage){
        compressImage(currentImage);
    }
});

imageInput.addEventListener("change", e => {

    const file = e.target.files[0];

    if(!file) return;

    currentImage = file;

    const reader = new FileReader();

    reader.onload = function(event){

        beforeImage.src = event.target.result;

        compressImage(file);

    };

    reader.readAsDataURL(file);

});

function compressImage(file){

    const quality = slider.value / 100;

    const img = new Image();

    img.onload = function(){

        const canvas = document.createElement("canvas");

        canvas.width = img.width;
        canvas.height = img.height;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(img,0,0);

        canvas.toBlob(blob => {

            compressedBlob = blob;

            afterImage.src =
            URL.createObjectURL(blob);

            stats[0].textContent =
            (file.size/1024).toFixed(2)+" KB";

            stats[1].textContent =
            (blob.size/1024).toFixed(2)+" KB";

            stats[2].textContent =
            (((file.size-blob.size)/file.size)*100)
            .toFixed(1)+"%";

        }, file.type || "image/jpeg", quality);

    };

    img.src = URL.createObjectURL(file);

}

document.querySelector(".download-btn")
.addEventListener("click", () => {

    if(!compressedBlob){
        alert("Upload image first");
        return;
    }

    const a = document.createElement("a");

    a.href = URL.createObjectURL(compressedBlob);

    a.download = "compressed-image";

    a.click();

});
</script>

</body>
<script src="script.js"></script>
</html>
