<script>

const imageInput = document.getElementById("imageInput");
const beforeImage = document.getElementById("beforeImage");
const afterImage = document.getElementById("afterImage");

const slider = document.querySelector("input[type=range]");
const qualityLabel = document.querySelector(".slider-area label");

const stats = document.querySelectorAll(".stat p");

let compressedBlob = null;
let currentImage = null;

slider.addEventListener("input", () => {
    qualityLabel.textContent =
        "Compression Quality: " + slider.value + "%";

    if(currentImage){
        compressImage(currentImage);
    }
});

imageInput.addEventListener("change", e => {

    const file = e.target.files[0];

    if(!file) return;

    currentImage = file;

    const reader = new FileReader();

    reader.onload = function(event){

        beforeImage.src = event.target.result;

        compressImage(file);

    };

    reader.readAsDataURL(file);

});

function compressImage(file){

    const quality = slider.value / 100;

    const img = new Image();

    img.onload = function(){

        const canvas = document.createElement("canvas");

        canvas.width = img.width;
        canvas.height = img.height;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(img,0,0);

        canvas.toBlob(blob => {

            compressedBlob = blob;

            const compressedURL =
                URL.createObjectURL(blob);

            afterImage.src = compressedURL;

            const originalKB =
                (file.size / 1024).toFixed(2);

            const compressedKB =
                (blob.size / 1024).toFixed(2);

            const saved =
                (
                    ((file.size - blob.size)
                    / file.size) * 100
                ).toFixed(1);

            stats[0].textContent =
                originalKB + " KB";

            stats[1].textContent =
                compressedKB + " KB";

            stats[2].textContent =
                saved + "%";

        },"image/jpeg",quality);

    };

    img.src = URL.createObjectURL(file);

}

document.querySelector(".download-btn")
.addEventListener("click", () => {

    if(!compressedBlob){
        alert("Upload image first");
        return;
    }

    const a = document.createElement("a");

    a.href =
        URL.createObjectURL(compressedBlob);

    a.download = "compressed-image.jpg";

    a.click();

});

</script>
