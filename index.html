<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Tools Hub - Guaranteed Load Fix</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>

    <style>
        :root {
            --bg-base: #0b0f19;
            --surface: rgba(17, 24, 39, 0.8);
            --surface-accent: rgba(30, 41, 59, 0.6);
            --border: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(99, 102, 241, 0.4);
            --primary: linear-gradient(135deg, #4f46e5, #7c3aed);
            --primary-glow: rgba(124, 58, 237, 0.3);
            --success: #10b981;
            --text-white: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(124, 58, 237, 0.12) 0%, transparent 40%);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(to right, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero {
            text-align: center;
            padding: 30px 20px 15px;
        }

        .hero h1 {
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p { font-size: 14px; color: var(--text-dim); }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
        }

        .tools-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .tool-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            text-align: left;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .tool-card:hover, .tool-card.active {
            border-color: #6366f1;
            box-shadow: 0 0 15px var(--primary-glow);
            transform: translateY(-2px);
        }

        .tool-card .icon-wrapper {
            width: 40px;
            height: 40px;
            background: var(--surface-accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }

        .tool-card.active .icon-wrapper { background: var(--primary); }
        .tool-card h2 { font-size: 15px; margin-bottom: 5px; font-weight: 700; }
        .tool-card p { color: var(--text-dim); font-size: 12px; line-height: 1.4; }

        .studio-workspace {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
        }

        .studio-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        @media(max-width: 850px) { .studio-grid { grid-template-columns: 1fr; } }

        .panel-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .dropzone {
            border: 2px dashed rgba(99, 102, 241, 0.3);
            background: var(--surface-accent);
            border-radius: 14px;
            padding: 30px 15px;
            text-align: center;
            cursor: pointer;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .dropzone.dragover {
            border-color: #10b981 !important;
            background: rgba(16, 185, 129, 0.1) !important;
        }

        .dropzone-icon, .dropzone div, .dropzone p { pointer-events: none; }
        .dropzone-icon { font-size: 30px; margin-bottom: 8px; }

        .control-box {
            background: var(--surface-accent);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            margin-top: 15px;
        }

        .form-item { margin-bottom: 14px; }
        .form-item:last-child { margin-bottom: 0; }
        .form-item label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 5px; }

        .input-control {
            width: 100%;
            padding: 10px 12px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 13px;
            outline: none;
        }

        input[type="range"].input-control { padding: 0; height: 5px; cursor: pointer; }

        .preview-panel {
            background: var(--surface-accent);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 250px;
            position: relative;
        }

        .canvas-preview-wrapper {
            max-width: 100%;
            max-height: 280px;
            position: relative;
            border-radius: 8px;
            display: none;
            overflow: hidden;
        }

        .crop-container-box { position: relative; display: inline-block; max-width: 100%; }
        
        .crop-overlay-selector {
            position: absolute;
            border: 2px dashed #6366f1;
            background: rgba(99, 102, 241, 0.2);
            cursor: move;
            display: none;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5);
            top: 10px;
            left: 10px;
            width: 100px;
            height: 100px;
            z-index: 10;
        }

        .canvas-preview-wrapper img {
            display: block;
            max-width: 100%;
            max-height: 280px;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }

        .placeholder-text { color: var(--text-dim); font-size: 13px; text-align: center; }

        .badge-status {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 10px;
            display: none;
        }

        .action-container { margin-top: 15px; width: 100%; }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px var(--primary-glow);
        }

        .btn-primary:hover { filter: brightness(1.1); }

        footer {
            margin-top: auto;
            text-align: center;
            padding: 15px;
            color: var(--text-dim);
            border-top: 1px solid var(--border);
            font-size: 12px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">✨ ImageTools.studio</div>
    </header>

    <section class="hero">
        <h1>All-in-One Media Transformation Suite</h1>
        <p>Local client-side fast
