<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Studio Engine - Ultimate Fixed Build</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            min-height: 100vh;
            padding: 0;
        }

        header {
            padding: 20px 30px;
            background: #111827;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: #6366f1;
        }

        .hero {
            text-align: center;
            padding: 40px 20px 20px;
        }

        .hero h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .hero p {
            font-size: 14px;
            color: #94a3b8;
        }

        .main-dashboard-wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .cards-selection-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            width: 100%;
        }

        .tool-action-card {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            flex: 1;
            min-width: 250px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tool-action-card:hover, .tool-action-card.active {
            border-color: #6366f1;
            background: #1e293b;
        }

        .card-icon {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .tool-action-card h3 {
            font-size: 16px;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .tool-action-card p {
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.4;
        }

        .studio-workspace-wrapper {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 25px;
            width: 100%;
        }

        .studio-columns-split {
            display: flex;
            flex-direction: row;
            gap: 30px;
        }

        @media (max-width: 800px) {
            .studio-columns-split {
                flex-direction: column;
            }
        }

        .workspace-column {
            flex: 1;
            min-width: 290px;
        }

        .panel-heading-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #94a3b8;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .dropzone-upload-area {
            border: 2px dashed rgba(99, 102, 241, 0.4);
            background: #0f172a;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .dropzone-upload-area.dragover {
            border-color: #10b981 !important;
            background: rgba(16, 185, 129, 0.1) !important;
        }

        .control-box-options {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
        }

        .form-row-item {
            margin-bottom: 15px;
        }

        .form-row-item label {
            display: block;
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .input-element-field {
            width: 100%;
            padding: 10px 12px;
            background: #0b0f19;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 13px;
            outline: none;
        }

        input[type="range"].input-element-field {
            padding: 0;
            height: 6px;
        }

        .preview-monitor-frame {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            position: relative;
        }

        .canvas-source-wrapper {
            max-width: 100%;
            display: none;
            position: relative;
        }

        .canvas-source-wrapper img {
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
            display: block;
        }

        .crop-bounding-selector-box {
            position: absolute;
            border: 2px dashed #6366f1;
            background: rgba(99, 102, 241, 0.25);
            cursor: move;
            display: none;
            box-shadow: 0 0 0 5000px rgba(0, 0, 0, 0.6);
            top: 10px;
            left: 10px;
            width: 120px;
            height: 120px;
            z-index: 5;
        }

        .placeholder-monitor-text {
            color: #94a3b8;
            font-size: 13px;
            text-align: center;
        }

        .engine-logs-badge {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 15px;
            display: none;
        }

        .trigger-action-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 20px;
        }

        .trigger-action-btn:hover {
            filter: brightness(1.1);
        }

        .engine-panel-box {
            display: none;
        }
        .engine-panel-box.active {
            display: block;
        }

        footer {
            margin-top: auto;
            text-align: center;
            padding: 20px;
            color: #94a3b8;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 12px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">✨
